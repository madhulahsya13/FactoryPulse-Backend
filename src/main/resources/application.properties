spring.application.name=FactoryPulse

# Server port: Render uses PORT; local development defaults to 8080
server.port=${PORT:8080}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/factorypulse}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate database dialect (detected automatically)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
